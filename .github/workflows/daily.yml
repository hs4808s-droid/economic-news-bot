name: 데일리 리포트

on:
  # 2026-09-15~22: GitHub 자체 schedule 트리거를 KST 06:30(UTC 21:30)로 썼으나
  # 평균 2~2.5시간(117~188분, 5회 측정 전부 이 범위) 지연되는 게 GitHub의
  # 낮은 스케줄 큐 우선순위 때문임을 확인했다(워크플로 설정 문제 아님).
  # 반면 workflow_dispatch는 매번 15~30초 안에 즉시 실행됐다.
  #
  # 2026-09-15~18에는 진단용 보조 스케줄(07:30 KST)까지 같이 둬서 매일 두 번
  # 같은 Claude 계정으로 도는 바람에 세션 한도 연쇄 실패까지 겪었다
  # (2026-09-18 09:37 KST). 두 번 도는 구조 자체가 위험하다는 뜻이었다.
  #
  # 2026-09-23: 그래서 GitHub schedule을 완전히 없애고, 외부 무료 cron
  # 서비스(cron-job.org)가 정시에 이 workflow_dispatch API를 직접 호출하는
  # 방식으로 바꿨다. dispatch는 지연이 없어 정확히 KST 06:30(화~토)에 돈다.
  # (검증: 2026-09-23T00:52 UTC 외부 트리거 → 같은 초에 실행 시작·성공 확인)
  # GitHub schedule을 다시 살리면 외부 cron과 하루 두 번 겹쳐 위 문제가
  # 재발하므로, 절대로 이 파일에 schedule: 블록을 다시 추가하지 않는다.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: 파이프라인 실행
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: bash run_daily.sh

      - name: 리포트 커밋 & push
        # 파이프라인이 중간에 실패했어도 만들어진 산출물은 남긴다.
        if: always()
        run: |
          DATE=$(date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs logs
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "report: $DATE"
            # 동시 실행은 concurrency로 막았지만, 수동 실행과 겹칠 때를 대비해 rebase 후 push.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: 실행 로그 보존
        # 2026-09-16: 메일 발송이 GitHub Secrets 문제로 실패했는데도 파이프라인
        # 자체는 "성공"으로 끝나(의도된 설계 — 메일 실패가 리포트 게시를 막지
        # 않는다) 원인 로그(5_send.err.log)를 못 봤다. 성공/실패 무관하게
        # 항상 보존해 이런 조용한 실패를 다음엔 바로 진단할 수 있게 한다.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: logs/
          retention-days: 7
