name: 데일리 리포트

on:
  # KST 화~토 06:30 실행. UTC로는 월~금 21:30 — KST가 9시간 빠르므로
  # "KST 화 06:30" = "UTC 월 21:30"이 되어 요일이 하루씩 당겨진다(화~토 → 월~금).
  # 21:30 UTC는 미 정규장 종가(EDT 20:00 UTC / EST 21:00 UTC) 이후라 서머타임과
  # 무관하게 항상 종가가 반영된 시점이다.
  # 2026-09-15: 로컬 Windows 예약작업(같은 Claude 계정 사용)과의 충돌로 첫 수동
  # 실행이 세션 한도 초과로 실패 → 예약작업 비활성화 후 재실행해 성공 확인. 활성화.
  # 2026-09-15~18: 위 진단용으로 07:30 KST(22:30 UTC) 트리거를 임시로 하나
  # 더 뒀었는데, 이게 매일 정규 스케줄 약 1시간 뒤 같은 계정으로 또
  # claude -p를 호출해 세션 한도를 연쇄로 소진시키는 원인이었다(2026-09-18
  # 09:37 KST 실패: "You've hit your session limit"). 제거.
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: 파이프라인 실행
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: bash run_daily.sh

      - name: 리포트 커밋 & push
        # 파이프라인이 중간에 실패했어도 만들어진 산출물은 남긴다.
        if: always()
        run: |
          DATE=$(date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs logs
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "report: $DATE"
            # 동시 실행은 concurrency로 막았지만, 수동 실행과 겹칠 때를 대비해 rebase 후 push.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: 실행 로그 보존
        # 2026-09-16: 메일 발송이 GitHub Secrets 문제로 실패했는데도 파이프라인
        # 자체는 "성공"으로 끝나(의도된 설계 — 메일 실패가 리포트 게시를 막지
        # 않는다) 원인 로그(5_send.err.log)를 못 봤다. 성공/실패 무관하게
        # 항상 보존해 이런 조용한 실패를 다음엔 바로 진단할 수 있게 한다.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: logs/
          retention-days: 7
