name: 경기 상황판

# docs/data/board.json 을 갱신한다. LLM 을 쓰지 않는다(코드만, 1분 안쪽).
# 일일 리포트(daily.yml)와 따로 돈다. daily.yml 에는 schedule 을 두지 않는 규칙이 있지만
# (Claude 를 하루 두 번 돌리게 되는 사고 방지), 이 워크플로는 Claude 를 쓰지 않으므로 GitHub schedule 을 쓴다.
# GitHub schedule 은 몇십 분~2시간 늦을 수 있다. 전날 자료를 보여주는 용도라 괜찮다.
# 더 정확한 시각이나 장중 갱신이 필요해지면 cron-job.org 가 이 워크플로의 workflow_dispatch 를 부르면 된다.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'   # KST 20:23 — 미국 아침 발표(고용·물가 등) 전, 전날 일별 자료 반영
    - cron: '23 22 * * *'   # KST 07:23 — 미국 장 마감 뒤
  push:
    branches: [main, 'claude/**']
    paths:
      - 'scripts/build_board.js'
      - 'config/board.json'
      - '.github/workflows/board.yml'

permissions:
  contents: write

concurrency:
  group: board-${{ github.ref }}
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 계산 규칙 자체 점검
        run: node scripts/build_board.js --selftest
      - name: 상황판 자료 만들기
        run: node scripts/build_board.js
      - name: 커밋 & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/board.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "board: $(date +%F\ %H:%M)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
